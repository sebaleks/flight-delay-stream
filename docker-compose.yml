# Local streaming stack (CLAUDE.md section 2): single-broker Kafka in KRaft
# mode + Schema Registry, Confluent 8.3.1 (arm64-native; ZooKeeper does not
# exist in 8.x). The demo and every test run against this; nothing depends on
# any cloud service.
services:
  kafka:
    image: confluentinc/cp-kafka:8.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topics are created explicitly by streaming/admin.py with the partition
      # layout the tail-keying design needs; accidental topics hide bugs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # RETENTION OFF, deliberately: replay events carry EVENT-TIME message
      # timestamps (September 2024, by design — no wall clock in the stream),
      # and the default 7-day time-based retention judges segments by exactly
      # those timestamps, deleting the whole replay week at the first
      # retention check (~5 minutes after broker start; log start advances to
      # the high watermark and every fetch reads "offset out of range"). The
      # dress rehearsal caught this as a consumer that scored 0 whenever the
      # produce-to-consume gap outlasted the race. Topics are recreated per
      # demo, so disk stays bounded at about one replay week.
      KAFKA_LOG_RETENTION_HOURS: "-1"
      # base64url("flight-delay-682") — a fixed 22-char KRaft cluster id so
      # the metadata volume survives compose restarts deterministically
      CLUSTER_ID: ZmxpZ2h0LWRlbGF5LTY4Mg
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      # the cp-schema-registry image ships no curl (found by the clean-machine
      # rehearsal: exit 127 on every probe); a bash /dev/tcp connect check is
      # the strongest probe the image supports
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
